<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tall Ships Antwerpen 2026 · live kaart</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0b1a2a; --panel:#0f2436; --panel2:#13314a; --line:#20476b;
    --ink:#e8f1f9; --mut:#8fb0cc; --accent:#41c7c7;
    --live:#3ddc84; --stale:#e0b341; --off:#5b7793;
    --A:#e0552b; --B:#3a86ff; --C:#8b5cf6; --D:#2dd4bf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  #app{display:flex;height:100vh;overflow:hidden}
  #side{width:340px;flex:0 0 340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  #map{flex:1;background:#08131f}
  header{padding:14px 16px;border-bottom:1px solid var(--line);position:relative}
  header h1{margin:0;font-size:16px;letter-spacing:.2px;padding-right:36px}
  header .sub{margin-top:3px;font-size:11px;color:var(--mut)}
  #routes{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--mut);cursor:pointer;user-select:none}
  #routes input{accent-color:var(--accent);width:13px;height:13px;margin:0;cursor:pointer}
  #routes.busy{opacity:.55;cursor:progress}
  #routes .n{color:var(--off)}
  #toggle{position:absolute;top:11px;right:12px;width:30px;height:30px;padding:0;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:7px;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #toggle:hover{background:var(--line)}
  #side.collapsed #list,#side.collapsed footer{display:none}
  #status{display:flex;gap:12px;padding:10px 16px;font-size:11px;color:var(--mut);border-bottom:1px solid var(--line);flex-wrap:wrap}
  #status b{color:var(--ink)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  #list{flex:1;overflow-y:auto}
  .row{display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
  .row:hover{background:var(--panel2)}
  .row .cls{flex:0 0 20px;height:20px;border-radius:5px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
  .row .nm{flex:1;min-width:0}
  .row .nm .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .nm .m{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .st{flex:0 0 auto;font-size:10px;color:var(--mut);text-align:right}
  .row .st .sd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px}
  footer{padding:9px 16px;font-size:10px;color:var(--off);border-top:1px solid var(--line);line-height:1.5}
  footer a{color:var(--mut)}
  .ship-marker .hull{filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .leaflet-tooltip.ship-lab{background:rgba(9,20,32,.82);border:0;color:#dff;font-size:11px;font-weight:600;box-shadow:none;padding:1px 5px}
  .leaflet-control-scale{margin-top:10px;margin-right:10px}
  .leaflet-control-scale-line{background:rgba(255,255,255,.78);border-color:#3a5f80;color:#173047;font-size:10px;font-weight:600;line-height:1.3}
  .leaflet-tooltip.ship-lab::before{display:none}
  .pop{max-width:240px}
  .pop b{font-size:13px}
  .pop .g{color:#456;font-size:11px}
  .pop .desc{margin:5px 0 2px;font-size:11.5px;line-height:1.45;color:#2a3742}
  .pop table{font-size:11px;margin-top:4px;border-collapse:collapse}
  .pop td{padding:1px 8px 1px 0}
  .pop .site{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:600;color:#0a6ebd;text-decoration:none}
  .pop .rtew{display:flex;align-items:center;gap:6px;margin-top:7px;padding-top:7px;border-top:1px solid #e3e9ee;font-size:11.5px;font-weight:600;color:#0a6ebd;cursor:pointer;user-select:none}
  .pop .rtew input{accent-color:#0a6ebd;width:13px;height:13px;margin:0;cursor:pointer}
  .pop .site:hover{text-decoration:underline}
  @media(max-width:720px){
    #app{flex-direction:column}
    #map{position:absolute;inset:0;width:100%;height:100%}
    #side{position:absolute;left:0;right:0;bottom:0;width:100%;flex-basis:auto;height:50%;z-index:1000;border-right:0;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.45)}
    #side.collapsed{height:auto}
    #status,footer{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <button id="toggle" aria-label="Lijst tonen of verbergen">✕</button>
      <h1>⛵ Tall Ships Antwerpen 2026</h1>
      <div class="sub">Live posities · The Tall Ships Races · 11–14 juli</div>
      <label id="routes" title="Route van de laatste 5 dagen. Dikke lijn = gevolgd via AIS, dunne lijn = geen ontvangst, geen echte vaarroute.">
        <input type="checkbox" id="routeChk"><span>Routes · 5 dagen</span><span class="n" id="routeN"></span>
      </label>
    </header>
    <div id="status">
      <span><span class="dot" id="cdot" style="background:var(--off)"></span><span id="cstate">opgeslagen posities</span></span>
      <span><b id="liveN">0</b> gelokaliseerd</span>
      <span><b id="totN">0</b> vloot</span>
      <span id="age"></span>
    </div>
    <div id="list"></div>
    <footer>
      Posities via <a href="https://aisstream.io" target="_blank">aisstream.io</a> (gratis AIS, enkel walontvangers). Schepen zonder AIS of buiten bereik verschijnen niet. Bron vloot: <a href="https://tallships.antwerpen.be" target="_blank">tallships.antwerpen.be</a>.
    </footer>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Embedded aisstream key: the page auto-connects the live stream for every visitor.
// Free, rate-limited, rotatable. Swap for your own if you fork.
// The page reads positions from the always-on collector service (one shared aisstream
// connection, fresh global snapshot, no key in the browser). Set this to your deployed
// collector URL. Empty = just show the static positions.json seed (no live updates).
const COLLECTOR_URL = 'https://aisfleetmap-9hnpn.ondigitalocean.app';
const USING_COLLECTOR = !!COLLECTOR_URL;
const POS_URL = USING_COLLECTOR ? COLLECTOR_URL.replace(/\/+$/,'')+'/positions.json' : 'positions.json';
const CLSCOL = {A:"#e0552b",B:"#3a86ff",C:"#8b5cf6",D:"#2dd4bf"};
const FLAG = {
  "Noorwegen":"🇳🇴","Duitsland":"🇩🇪","Polen":"🇵🇱","Denemarken":"🇩🇰","Nederland":"🇳🇱",
  "Italië":"🇮🇹","Verenigd Koninkrijk":"🇬🇧","België":"🇧🇪","Frankrijk":"🇫🇷","Spanje":"🇪🇸",
  "Portugal":"🇵🇹","Letland":"🇱🇻","Oostenrijk":"🇦🇹"
};
let SHIPS = [], byMMSI = {};
const markers = {};   // mmsi -> L.marker
const popupHtml = {}; // mmsi -> last popup html, to avoid pointless re-renders
const state   = {};   // mmsi -> {lat,lon,sog,cog,hdg,t,src}

// ---- map ----
const map = L.map('map',{zoomControl:true,worldCopyJump:true}).setView([52.5,3.5],6);
// Seamarks (buoys/beacons) live in their own pane so they always stay above the base.
map.createPane('seamark'); map.getPane('seamark').style.zIndex = 350;
L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',
  {pane:'seamark', maxZoom:19, opacity:0.9, attribution:'© OpenSeaMap'}).addTo(map);

// Two bases: Esri Ocean chart (bathymetry) for the overview, CARTO Voyager (crisp
// harbour/street detail) once you zoom in. Swap on zoom so it's never grainy.
const oceanBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:19, maxNativeZoom:13, attribution:'Esri, GEBCO, NOAA'});
const oceanRef  = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:19, maxNativeZoom:13});
const detailBase = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  {maxZoom:20, subdomains:'abcd', attribution:'&copy; OpenStreetMap &copy; CARTO'});

const DETAIL_FROM = 13;
function pickBase(){
  if(map.getZoom() >= DETAIL_FROM){
    if(map.hasLayer(oceanBase)){ map.removeLayer(oceanBase); map.removeLayer(oceanRef); }
    if(!map.hasLayer(detailBase)) detailBase.addTo(map);
  }else{
    if(map.hasLayer(detailBase)) map.removeLayer(detailBase);
    if(!map.hasLayer(oceanBase)){ oceanBase.addTo(map); oceanRef.addTo(map); }
  }
}
map.on('zoomend', pickBase);
pickBase();
// Scale bar. Extends Leaflet's own so the km line keeps its behaviour, and adds a nautical
// line under it: this is a ships map and AIS range is talked about in zeemijl, not km.
// Leaflet's _getRoundNum floors to 1, so below 1 nm the line is hidden rather than wrong.
const ScaleNM = L.Control.Scale.extend({
  onAdd(map){
    // The parent onAdd calls _update() before we get to create _nScale, so the override
    // below must tolerate it being absent, and we re-run _update once it exists.
    const c = L.Control.Scale.prototype.onAdd.call(this, map);
    this._nScale = L.DomUtil.create('div', 'leaflet-control-scale-line nm', c);
    this._update();
    return c;
  },
  _updateScales(maxMeters){
    L.Control.Scale.prototype._updateScales.call(this, maxMeters);
    if(!this._nScale || !maxMeters) return;
    const maxNM = maxMeters/1852;
    if(maxNM < 1){ this._nScale.style.display = 'none'; return; }
    this._nScale.style.display = '';
    const nm = this._getRoundNum(maxNM);
    this._updateScale(this._nScale, nm+' zeemijl', nm/maxNM);
  }
});
new ScaleNM({position:'topright', maxWidth:130, metric:true, imperial:false}).addTo(map);

L.circleMarker([51.229,4.405],{radius:5,color:"#41c7c7",fillColor:"#41c7c7",fillOpacity:1})
  .addTo(map).bindTooltip("Antwerpen");

// Auto-frame the fleet until the user takes control of the map.
let userMoved=false, programmatic=false;
function withProg(fn){ programmatic=true; fn(); setTimeout(()=>{programmatic=false;},450); }
map.on('dragstart zoomstart', ()=>{ if(!programmatic) userMoved=true; });
function fitFleet(){
  const pts = Object.values(state).filter(s=>s.lat!=null).map(s=>[s.lat,s.lon]);
  if(!pts.length) return;
  const mobile = window.matchMedia('(max-width:720px)').matches;
  withProg(()=>{
    if(pts.length===1){ map.setView(pts[0], 11); return; }
    const b = L.latLngBounds(pts);
    map.fitBounds(b, mobile
      ? {paddingTopLeft:[24,24], paddingBottomRight:[24, Math.round(window.innerHeight*0.5)], maxZoom:12}
      : {padding:[55,60], maxZoom:12});
  });
}

function shipIcon(cls, hdg){
  const col = CLSCOL[cls]||"#89a";
  const rot = (hdg==null||hdg===511)?0:hdg;
  return L.divIcon({
    className:'ship-marker', iconSize:[22,22], iconAnchor:[11,11],
    html:`<svg class="hull" width="22" height="22" viewBox="0 0 22 22" style="transform:rotate(${rot}deg)">
       <path d="M11 1 L16 15 Q11 19 6 15 Z" fill="${col}" stroke="#fff" stroke-width="1.2"/></svg>`
  });
}
// Zoom used when you click a ship in the list: enough context to see WHERE she is, rather
// than her berth. Tuned to ~30 km / 20 zeemijl on the scale bar. Derived from metres-per-
// pixel so it holds at any latitude, instead of hard-coding a zoom that drifts north.
const CTX_M_PER_PX = 376;
function contextZoom(lat){
  return Math.round(Math.log2(156543.03392*Math.cos(lat*Math.PI/180)/CTX_M_PER_PX));
}
function fmtAgo(t){
  if(!t) return "";
  const s = Math.round((Date.now()-t)/1000);
  if(s<60) return s+"s";
  if(s<3600) return Math.round(s/60)+"m";
  if(s<86400) return Math.round(s/3600)+"h";
  return Math.round(s/86400)+"d";
}
function upsert(mmsi){
  const s = byMMSI[mmsi], st = state[mmsi];
  if(!s||!st||st.lat==null) return;
  if(markers[mmsi]){
    markers[mmsi].setLatLng([st.lat,st.lon]).setIcon(shipIcon(s.klasse, st.hdg??st.cog));
  }else{
    const m = L.marker([st.lat,st.lon],{icon:shipIcon(s.klasse, st.hdg??st.cog)}).addTo(map);
    m.bindTooltip(s.name,{permanent:true,direction:'right',className:'ship-lab',offset:[9,0]});
    // Bound once, WITH options: passing options to bindPopup again would construct a fresh
    // Popup and drop the open one. Content is refreshed via setPopupContent below.
    m.bindPopup('',{autoPanPadding:[25,25]});
    markers[mmsi]=m;
  }
  const speed = st.sog!=null? st.sog.toFixed(1)+" kn":"—";
  const crs = st.cog!=null? Math.round(st.cog)+"°":"—";
  const html =
    `<div class="pop"><b>${s.fl} ${s.name}</b> <span class="g">${s.klasse}-klasse</span>
     ${s.description?`<div class="desc">${s.description}</div>`:``}
     <table>
       <tr><td>Snelheid</td><td>${speed}</td></tr>
       <tr><td>Koers</td><td>${crs}</td></tr>
       <tr><td>MMSI</td><td>${s.mmsi}</td></tr>
       ${s.cs?`<tr><td>Callsign</td><td>${s.cs}</td></tr>`:``}
       <tr><td>Update</td><td>${fmtAgo(st.t)} geleden${st.src==='live'?' · live':''}</td></tr>
     </table>
     ${USING_COLLECTOR?`<label class="rtew"><input type="checkbox" class="rte" data-m="${s.mmsi}"><span>Route · ${ROUTE_DAYS} dagen</span></label>`:``}
     ${s.website?`<a class="site" href="${s.website}" target="_blank" rel="noopener">Website ↗</a>`:``}
     </div>`;
  // Only push content that actually changed. Setting it re-runs Leaflet's _adjustPan, so
  // rewriting an identical popup every 10 s was nudging the map under an open popup.
  if(popupHtml[mmsi] !== html){ popupHtml[mmsi] = html; markers[mmsi].setPopupContent(html); }
}

// ---- sidebar ----
const listEl = document.getElementById('list');
function renderList(){
  const rows = SHIPS.slice().sort((a,b)=>{
    const la=state[a.mmsi]&&state[a.mmsi].lat!=null, lb=state[b.mmsi]&&state[b.mmsi].lat!=null;
    if(la!==lb) return la?-1:1;
    return a.name.localeCompare(b.name);
  });
  let live=0;
  listEl.innerHTML = rows.map(s=>{
    const st=state[s.mmsi]; const has=st&&st.lat!=null; if(has)live++;
    const fresh = has && (Date.now()-st.t)<30*60*1000;
    const col = !has?"var(--off)":(fresh?"var(--live)":"var(--stale)");
    const detail = has?`${st.sog!=null?st.sog.toFixed(1)+' kn':''} · ${fmtAgo(st.t)}`:'geen signaal';
    return `<div class="row" data-m="${s.mmsi}">
      <div class="cls" style="background:${CLSCOL[s.klasse]}">${s.klasse}</div>
      <div class="nm"><div class="n">${s.fl} ${s.name}</div><div class="m">MMSI ${s.mmsi}</div></div>
      <div class="st">${detail}<span class="sd" style="background:${col}"></span></div>
    </div>`;
  }).join('');
  document.getElementById('liveN').textContent=live;
  document.getElementById('totN').textContent=SHIPS.length;
  listEl.querySelectorAll('.row').forEach(r=>r.onclick=()=>{
    const m=r.dataset.m, st=state[m];
    if(st&&st.lat!=null){
      userMoved=true;
      const mobile = window.matchMedia('(max-width:720px)').matches;
      const ll = L.latLng(st.lat, st.lon);
      // fitBounds on a single point = padded setView, so the ship lands above the
      // bottom sheet (mobile) with room for its popup at the top.
      withProg(()=>map.fitBounds(L.latLngBounds(ll, ll), {
        maxZoom: contextZoom(st.lat),
        paddingTopLeft: [30, mobile?90:60],
        paddingBottomRight: [30, mobile? Math.round(window.innerHeight*0.5)+30 : 40]
      }));
      // Open the popup only once the map has settled. Leaflet animates a SHORT pan but jumps
      // a long one, so opening immediately made autoPan measure against a half-finished view
      // and pan again on top of it: a ship near others ended up off-centre, a distant one
      // did not. moveend never fires when the view does not change, hence the fallback.
      const mk = markers[m];
      if(mk){
        let done = false;
        const open = ()=>{ if(done) return; done = true; map.off('moveend', open); mk.openPopup(); };
        map.once('moveend', open);
        setTimeout(open, 700);
      }
    }
  });
}

// ---- load fleet + stored positions ----
async function loadFleet(){
  const r = await fetch('ships.json',{cache:'no-store'});
  const j = await r.json();
  // active:false ships are hidden from the map/list (still tracked server-side).
  SHIPS = j.ships.filter(s=>s.active!==false).map(s=>({...s, mmsi:String(s.mmsi), fl:FLAG[s.land]||'', cs:s.callsign}));
  byMMSI = Object.fromEntries(SHIPS.map(s=>[s.mmsi,s]));
}
async function loadPositions(){
  try{
    const r = await fetch(POS_URL+'?_='+Date.now(),{cache:'no-store'});
    const j = await r.json();
    const p = j.positions||{};
    // Show every last-known position the collector holds, regardless of age. The sidebar
    // "x min/h ago" indicator conveys staleness; this is last-known-location behaviour.
    for(const mmsi in p){
      if(!byMMSI[mmsi]) continue;
      const st = state[mmsi]||(state[mmsi]={});
      const d=p[mmsi];
      st.lat=d.lat; st.lon=d.lon; st.sog=d.sog; st.cog=d.cog; st.hdg=d.hdg;
      st.t=d.t?new Date(d.t).getTime():Date.now(); st.src='stored';
      upsert(mmsi);
    }
    const ageEl=document.getElementById('age');
    if(j.generatedAt) ageEl.textContent='bijgewerkt '+fmtAgo(new Date(j.generatedAt).getTime())+' geleden';
  }catch(e){ /* positions.json may not exist yet */ }
  if(!userMoved) fitFleet();
  renderList();
}

// ---- routes: per-ship tail of the last N days, coloured by class ----
// The window is measured back from each ship's OWN newest stored fix, not from now, so the
// tails still resolve when the upstream feed has been down for a while.
const ROUTE_DAYS = 5;
const ROUTE_GAP_KM = 5;               // straight-line jump longer than this = not tracked
const ROUTE_STALE_MS = 6*3600*1000;   // history this far behind last-known = truncated, skip it
const routeLayer = L.layerGroup().addTo(map);
const routeCache = {};                // mmsi -> {at, track}
const routesEl = document.getElementById('routes'),
      routeChk = document.getElementById('routeChk'),
      routeN   = document.getElementById('routeN');

async function fetchTrack(mmsi){
  const c = routeCache[mmsi];
  if(c && Date.now()-c.at < 60000) return c.track;
  const base = COLLECTOR_URL.replace(/\/+$/,'');
  const r = await fetch(`${base}/track?mmsi=${mmsi}&days=${ROUTE_DAYS}&_=${Date.now()}`,{cache:'no-store'});
  const j = await r.json();
  const track = Array.isArray(j.track) ? j.track : [];
  routeCache[mmsi] = {at:Date.now(), track};
  return track;
}

// Windowing is done client-side too: a collector without ?days= returns the full history,
// and we still want exactly 5 days out of it.
function routeWindow(mmsi, track){
  if(track.length < 2) return null;
  const newest = new Date(track[track.length-1].t).getTime();
  const st = state[mmsi];
  // Guard against a truncated history (row cap): a tail ending days before the ship's
  // last-known position would be drawn nowhere near its marker. Better to show none.
  if(st && st.t && st.t - newest > ROUTE_STALE_MS) return null;
  const cutoff = newest - ROUTE_DAYS*86400e3;
  const rows = track.filter(r=>new Date(r.t).getTime() >= cutoff);
  return rows.length >= 2 ? rows : null;
}

// Split into tracked runs and untracked jumps. The free AIS feed delivers roughly 8% of an
// underway ship's transmissions, so a long silence means we lost her: drawing that leg at
// full weight would claim a route she never sailed (they run straight over Jutland). A thin
// hairline says "she came from there", without asserting the path.
//
// Split on DISTANCE, not elapsed time. Time thresholds cut the line wherever delivery
// stuttered, breaking a continuously-followed leg into a dashed-looking mess, and they let a
// fast ship cover any distance under the limit. Distance bounds the worst falsely-solid leg
// at the threshold itself, and leaves a ship sitting in port unbroken (nothing to interpolate).
function metres(aLat, aLon, bLat, bLon){
  const k = 111320;
  return Math.hypot((aLat-bLat)*k, (aLon-bLon)*k*Math.cos(aLat*Math.PI/180));
}
function routeSegments(rows){
  const tracked = [], guessed = [];
  let run = [rows[0]];
  for(let i=1;i<rows.length;i++){
    const km = metres(rows[i-1].lat, rows[i-1].lon, rows[i].lat, rows[i].lon)/1000;
    if(km > ROUTE_GAP_KM){
      if(run.length > 1) tracked.push(run);
      guessed.push([rows[i-1], rows[i], (new Date(rows[i].t)-new Date(rows[i-1].t))/60000]);
      run = [rows[i]];
    }else run.push(rows[i]);
  }
  if(run.length > 1) tracked.push(run);
  return {tracked, guessed};
}
function fmtDur(min){
  if(min < 90) return Math.round(min)+' min';
  if(min < 48*60) return (min/60).toFixed(1).replace('.',',')+' u';
  return (min/1440).toFixed(1).replace('.',',')+' d';
}

// Routes are held per ship so the popup can toggle one on its own. The header box is a
// select-all over the same set, and goes indeterminate when only some ships are shown.
const routeOn = new Set();     // mmsi whose route is requested
const routeLayers = {};        // mmsi -> L.LayerGroup actually on the map

function buildRoute(s, track){
  const rows = routeWindow(s.mmsi, track);
  if(!rows) return null;
  const col = CLSCOL[s.klasse]||"#89a";
  const {tracked, guessed} = routeSegments(rows);
  const g = L.layerGroup();
  // One multi-polyline per style per ship: ~2000 separate paths across the fleet is
  // enough to make panning stutter, and this collapses it to two layers each.
  if(tracked.length) g.addLayer(L.polyline(tracked.map(run=>run.map(r=>[r.lat,r.lon])),
    {color:col, weight:3.5, opacity:.9, smoothFactor:1.5, lineJoin:'round', lineCap:'round'})
    .bindTooltip(`${s.name} · gevolgd via AIS`,{sticky:true,className:'ship-lab'}));
  if(guessed.length){
    const longest = guessed.reduce((a,b)=>b[2]>a[2]?b:a);
    g.addLayer(L.polyline(guessed.map(([a,b])=>[[a.lat,a.lon],[b.lat,b.lon]]),
      {color:col, weight:1, opacity:.55})
      .bindTooltip(`${s.name} · geen ontvangst · ${guessed.length}×, langste ${fmtDur(longest[2])}`,
        {sticky:true,className:'ship-lab'}));
  }
  g._gaps = guessed.length;
  return g;
}
function hideRoute(mmsi){
  const g = routeLayers[mmsi];
  if(g){ routeLayer.removeLayer(g); delete routeLayers[mmsi]; }
}
async function showRoute(mmsi, force){
  if(routeLayers[mmsi] && !force) return true;
  const s = byMMSI[mmsi];
  if(!s) return false;
  let track;
  try{ track = await fetchTrack(mmsi); }catch(e){ return false; }
  if(!routeOn.has(mmsi)) return false;              // switched off while loading
  const g = buildRoute(s, track);
  if(!g) return false;
  hideRoute(mmsi);                                  // swap late, so a refresh does not blink
  routeLayers[mmsi] = g;
  routeLayer.addLayer(g);
  return true;
}
function syncRouteUI(){
  const n = Object.keys(routeLayers).length;
  const gaps = Object.values(routeLayers).reduce((a,g)=>a+(g._gaps||0),0);
  const missing = routeOn.size - n;
  routeN.textContent = routeOn.size
    ? `· ${n} route${n===1?'':'s'} · ${gaps} onderbrekingen${missing>0?` · ${missing} onvolledig`:''}`
    : '';
  routeChk.checked = routeOn.size > 0;
  routeChk.indeterminate = routeOn.size > 0 && routeOn.size < SHIPS.length;
}
async function syncRoutes(force){
  routesEl.classList.add('busy');
  for(const mmsi of Object.keys(routeLayers)) if(!routeOn.has(mmsi)) hideRoute(mmsi);
  const queue = [...routeOn].filter(m=>force || !routeLayers[m]);
  // Small pool: this is our own collector, one instance, so don't open 34 sockets at once.
  await Promise.all(Array.from({length:6}, async ()=>{
    while(queue.length) await showRoute(queue.shift(), force);
  }));
  syncRouteUI();
  routesEl.classList.remove('busy');
}

// Header box = select all / clear all.
routeChk.onchange = ()=>{
  routeOn.clear();
  if(routeChk.checked) SHIPS.forEach(s=>routeOn.add(s.mmsi));
  syncRouteUI();
  syncRoutes();
};
// Per-ship box inside the popup. Delegated, because popup content is re-created on open.
document.addEventListener('change', e=>{
  const el = e.target;
  if(!el.matches || !el.matches('input.rte')) return;
  const m = el.dataset.m;
  if(el.checked) routeOn.add(m); else routeOn.delete(m);
  syncRouteUI();
  syncRoutes();
});
// The popup html is cached and shared, so the checkbox state is applied when it opens.
map.on('popupopen', e=>{
  const el = e.popup.getElement() && e.popup.getElement().querySelector('input.rte');
  if(el) el.checked = routeOn.has(el.dataset.m);
});
// Keep tails growing while any of them is shown (cache TTL keeps this cheap).
setInterval(()=>{ if(routeOn.size) syncRoutes(true); }, 120000);
if(!USING_COLLECTOR){ routeChk.disabled = true; routesEl.title = 'Routes vereisen de collector'; }

// ---- connection status ----
const cdot=document.getElementById('cdot'), cstate=document.getElementById('cstate');
function setConn(s,label){ cdot.style.background = s==='on'?'var(--live)':s==='wait'?'var(--stale)':'var(--off)'; cstate.textContent=label; }

// Collapse / expand the fleet panel (title-bar button, works in the mobile layout).
const sideEl=document.getElementById('side'), toggleBtn=document.getElementById('toggle');
function syncToggle(){ toggleBtn.textContent = sideEl.classList.contains('collapsed') ? '☰' : '✕'; }
toggleBtn.onclick=()=>{ sideEl.classList.toggle('collapsed'); syncToggle(); setTimeout(()=>map.invalidateSize(),260); };
syncToggle();

// ---- boot ----
(async ()=>{
  await loadFleet();
  renderList();
  await loadPositions();
  setInterval(loadPositions, USING_COLLECTOR ? 10000 : 60000);
  setInterval(renderList, 10000);     // keep "x min ago" fresh
  setConn(USING_COLLECTOR ? 'on' : 'off', USING_COLLECTOR ? 'live' : 'opgeslagen posities');
})();
</script>
</body>
